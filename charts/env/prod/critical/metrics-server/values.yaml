# Values passed through to the metrics-server subchart (dependency name:
# metrics-server).
# Full reference: https://github.com/kubernetes-sigs/metrics-server/blob/metrics-server-helm-chart-3.14.0/charts/metrics-server/values.yaml
metrics-server:
  replicas: 2

  # Pin to the system node group (terraform/envs/prod's
  # eks_managed_node_groups.default: labels role=system, taint
  # CriticalAddonsOnly=true:NoSchedule). The chart already defaults
  # `priorityClassName: system-cluster-critical`; nodeSelector/tolerations
  # default to empty here, so both need setting explicitly.
  nodeSelector:
    role: system
  tolerations:
    - key: CriticalAddonsOnly
      operator: Equal
      value: "true"
      effect: NoSchedule

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 200Mi
