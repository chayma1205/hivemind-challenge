apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  role: {{ .Values.nodePool.nodeRoleName | quote }}
  amiSelectorTerms:
    - alias: {{ .Values.nodePool.amiFamily | lower }}@latest
  subnetSelectorTerms:
    - tags:
        {{ .Values.nodePool.discoveryTagKey }}: {{ .Values.nodePool.discoveryTagValue | quote }}
  securityGroupSelectorTerms:
    - tags:
        {{ .Values.nodePool.discoveryTagKey }}: {{ .Values.nodePool.discoveryTagValue | quote }}
  tags:
    karpenter.sh/discovery: {{ .Values.nodePool.discoveryTagValue | quote }}
