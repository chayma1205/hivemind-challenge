# Values passed through to the karpenter subchart (dependency name: karpenter).
# Full reference: https://github.com/aws/karpenter-provider-aws/blob/v1.14.1/charts/karpenter/values.yaml
karpenter:
  settings:
    # Must match terraform var.cluster_name (terraform/envs/prod).
    clusterName: hivemind-prod
    # Leave empty: Karpenter discovers the endpoint at startup on EKS.
    clusterEndpoint: ""
    eksControlPlane: true
    # From terraform/envs/prod output `karpenter_interruption_queue_name`
    # (module.karpenter, terraform-aws-modules/eks/aws//modules/karpenter).
    interruptionQueue: "Karpenter-hivemind-prod"

    # ALPHA feature, off by default in the chart. Without it, a node whose
    # kubelet stops posting status (Ready: Unknown) just sits there
    # forever — confirmed live: one did, for ~3 hours, until manually
    # cleaned up (`kubectl delete nodeclaim`). With it, Karpenter's own
    # RepairPolicies (pkg/cloudprovider/cloudprovider.go in
    # karpenter-provider-aws) terminate and replace a node after
    # Ready=False/Unknown for 30 minutes — no alerting/paging required,
    # just stops a dead node from sitting there indefinitely.
    featureGates:
      nodeRepair: true

  serviceAccount:
    create: true
    annotations:
      # From terraform/envs/prod output `karpenter_iam_role_arn`.
      eks.amazonaws.com/role-arn: "arn:aws:iam::324464328617:role/hivemind-prod-karpenter-controller"

  replicas: 2

  controller:
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        memory: 512Mi

  # Pin to the system node group (terraform/envs/prod's
  # eks_managed_node_groups.default: labels role=system, taint
  # CriticalAddonsOnly=true:NoSchedule) so the controller isn't itself a
  # workload Karpenter has to find capacity for. The chart already defaults
  # `priorityClassName: system-cluster-critical` and a
  # `CriticalAddonsOnly` toleration (operator: Exists, matching our taint
  # regardless of value/effect) — only nodeSelector needs adding here.
  nodeSelector:
    role: system

# Values for this chart's own templates (NodePool / EC2NodeClass), not the
# karpenter subchart.
nodePool:
  # IAM role Karpenter-launched EC2 instances assume (NOT an instance
  # profile ARN — Karpenter creates the instance profile itself from this
  # role name). From terraform/envs/prod output
  # `karpenter_node_iam_role_name`.
  nodeRoleName: "hivemind-prod-karpenter-node"
  # Tags used to discover subnets/security groups for launched nodes.
  # Matching `karpenter.sh/discovery = <cluster-name>` tag is applied to
  # the VPC's private subnets and the node security group in
  # terraform/envs/prod/main.tf (private_subnet_tags,
  # node_security_group_tags).
  discoveryTagKey: karpenter.sh/discovery
  discoveryTagValue: hivemind-prod

  amiFamily: AL2023

  instanceCategories: ["c", "m", "r"]
  capacityTypes: ["on-demand"]

  limits:
    cpu: "100"

  consolidationPolicy: WhenEmptyOrUnderutilized
  consolidateAfter: 5m
  expireAfter: 720h
