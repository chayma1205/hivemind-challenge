# Values passed through to the aws-load-balancer-controller subchart
# (dependency name: aws-load-balancer-controller).
# Full reference: https://github.com/aws/eks-charts/blob/master/stable/aws-load-balancer-controller/values.yaml
aws-load-balancer-controller:
  # Must match terraform var.cluster_name (terraform/envs/prod).
  clusterName: hivemind-prod
  region: us-east-1
  # No vpcId set, deliberately (was previously hardcoded from a
  # terraform output — the exact kind of thing that goes stale). Its
  # controller flag (--aws-vpc-id) defaults to reading the VPC from EC2
  # instance metadata of the node it's running on when unset
  # (confirmed against the controller's own docs, not assumed). Hit this
  # live after a full infra rebuild: the VPC got a new ID, this value
  # didn't, and the controller silently searched a VPC that no longer
  # existed ("Evaluated 0 subnets") for 8 hours until someone noticed
  # neither ingress ever got an ALB. Auto-detection can't go stale the
  # same way — it re-reads the actual VPC the running pod is in.
  vpcId: ""

  ingressClass: alb
  createIngressClassResource: true

  serviceAccount:
    create: true
    annotations:
      # From terraform/envs/prod output
      # `aws_load_balancer_controller_iam_role_arn`
      # (module.aws_load_balancer_controller_irsa).
      eks.amazonaws.com/role-arn: "arn:aws:iam::324464328617:role/hivemind-prod-aws-load-balancer-controller"

  replicaCount: 2

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi

  # Pin to the system node group (terraform/envs/prod's
  # eks_managed_node_groups.default: labels role=system, taint
  # CriticalAddonsOnly=true:NoSchedule). The chart already defaults
  # `priorityClassName: system-cluster-critical`; nodeSelector/tolerations
  # default to empty here, so both need setting explicitly.
  nodeSelector:
    role: system
  tolerations:
    - key: CriticalAddonsOnly
      operator: Equal
      value: "true"
      effect: NoSchedule
