{{- if .Values.domainCertificate.enabled }}
# Waits for templates/certificate.yaml's cert to actually validate (i.e.
# for the DNS record above to be visible to ACM) before ACM will mark it
# ISSUED. certificateArnRef resolves the ARN from the Certificate object
# by name — no need to hardcode or pass it through values.
apiVersion: acm.aws.upbound.io/v1beta1
kind: CertificateValidation
metadata:
  name: wildcard
spec:
  providerConfigRef:
    name: {{ .Values.providerConfig.name }}
  forProvider:
    region: us-east-1
    certificateArnRef:
      name: wildcard
    {{- if .Values.domainCertificate.validationRecord.enabled }}
    # Explicit dependency on the Record actually existing, plus an extra
    # sanity check on top of ACM's own polling.
    validationRecordFqdns:
      - {{ .Values.domainCertificate.validationRecord.name | quote }}
    {{- end }}
{{- end }}
