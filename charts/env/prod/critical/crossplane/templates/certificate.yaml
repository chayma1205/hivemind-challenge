{{- if .Values.domainCertificate.enabled }}
# Wildcard ACM cert for the ALB-fronted ingresses (argocd, greeter — see
# their charts' values.yaml). DNS-validated: see
# templates/certificate-validation-record.yaml and
# templates/certificatevalidation.yaml for the rest of the chain.
apiVersion: acm.aws.upbound.io/v1beta1
kind: Certificate
metadata:
  name: wildcard
spec:
  providerConfigRef:
    name: {{ .Values.providerConfig.name }}
  forProvider:
    region: us-east-1
    domainName: "*.{{ .Values.domainCertificate.domainName }}"
    subjectAlternativeNames:
      - {{ .Values.domainCertificate.domainName }}
    validationMethod: DNS
{{- end }}
