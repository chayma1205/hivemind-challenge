# Pins the AWS family provider's pod (installed via
# crossplane.provider.packages in values.yaml) to a fixed ServiceAccount
# name and the system node group. Named "default" to match
# Provider.spec.runtimeConfigRef's own default, so the auto-created
# Provider object picks this up with no explicit reference needed.
#
# sync-wave: this CRD is registered by Crossplane core itself at pod
# startup, not bundled as a CRD manifest in this chart or the subchart —
# it doesn't exist until the crossplane Deployment (wave 0, implicit) has
# actually started and become Healthy. Applying it in the same wave as
# first install races the CRD registration and fails with "the server
# could not find the requested resource" (confirmed against a real first
# sync). Argo CD waits for each wave to be Synced+Healthy before starting
# the next, so wave 1 is enough — no fixed delay needed.
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: {{ .Values.runtimeConfig.name }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  serviceAccountTemplate:
    metadata:
      name: {{ .Values.runtimeConfig.serviceAccountName }}
  deploymentTemplate:
    spec:
      template:
        spec:
          nodeSelector:
            role: system
          tolerations:
            - key: CriticalAddonsOnly
              operator: Equal
              value: "true"
              effect: NoSchedule
