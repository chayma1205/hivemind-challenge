# Pins the AWS family provider's pod (installed via
# crossplane.provider.packages in values.yaml) to a fixed ServiceAccount
# name and the system node group. Named "default" to match
# Provider.spec.runtimeConfigRef's own default, so the auto-created
# Provider object picks this up with no explicit reference needed.
#
# This CRD is registered by Crossplane core itself at pod startup, not
# bundled as a CRD manifest in this chart or the subchart — it doesn't
# exist until the crossplane Deployment has actually started.
#
# sync-wave "1" alone isn't enough on first install: confirmed against a
# real first sync that Argo CD validates every resource's GVK is
# discoverable *before* wave sequencing even starts, and aborts the whole
# sync (nothing applies, not even wave-0 resources) if any one of them
# can't be discovered yet — "failed to discover server resources for
# group version pkg.crossplane.io/v1beta1: the server could not find the
# requested resource", retried 5 times, nothing else in the sync ever
# applied. SkipDryRunOnMissingResource=true tells Argo CD to skip that
# resource's dry-run/discovery check instead of failing the batch when
# its CRD is missing — it just gets retried on a later sync once
# Crossplane has registered the CRD. sync-wave stays too, so once the CRD
# does exist, this still waits for crossplane core to be Healthy first.
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: {{ .Values.runtimeConfig.name }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  serviceAccountTemplate:
    metadata:
      name: {{ .Values.runtimeConfig.serviceAccountName }}
  deploymentTemplate:
    # `selector` and `template.spec.containers` are structurally required
    # by this CRD's schema (it's typed as a full apps/v1 DeploymentSpec),
    # even though Crossplane only merges this as a *patch* onto the real
    # generated Deployment rather than applying it directly — confirmed
    # live: without these, the apply silently failed schema validation
    # ("spec.deploymentTemplate.spec.template.spec.containers: Required
    # value, spec.deploymentTemplate.spec.selector: Required value"), and
    # Argo CD kept retrying against an empty `spec: {}` object with no
    # visible error short of reading the sync operation's raw result.
    # `package-runtime` is the actual container name Crossplane's package
    # manager uses for every provider pod (confirmed against a live pod
    # spec) — this entry doesn't set anything on it, it exists only to
    # satisfy the schema's `minItems`/`required name` on the array.
    spec:
      selector: {}
      template:
        spec:
          containers:
            - name: package-runtime
          nodeSelector:
            role: system
          tolerations:
            - key: CriticalAddonsOnly
              operator: Equal
              value: "true"
              effect: NoSchedule
