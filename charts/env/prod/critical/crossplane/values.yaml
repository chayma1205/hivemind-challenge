# Values passed through to the crossplane subchart (dependency name: crossplane).
# Full reference: https://github.com/crossplane/crossplane/blob/v2.4.1/cluster/charts/crossplane/values.yaml
crossplane:
  replicas: 2

  resourcesCrossplane:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1024Mi

  resourcesRBACManager:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 100m
      memory: 512Mi

  # Installs the AWS family meta-provider at `helm install`/sync time via
  # Crossplane's own `core init --provider` (see the chart's deployment.yaml
  # init container), instead of a separate `kubectl apply -f provider.yaml`
  # step. Its Provider object picks up runtimeConfigRef.name: "default"
  # (the CRD's own default), which resolves to this chart's
  # DeploymentRuntimeConfig (templates/deploymentruntimeconfig.yaml,
  # named "default") — that's what pins its pod to the system node group
  # and gives it a fixed ServiceAccount name for the EKS Pod Identity
  # association in terraform/envs/prod/domain.tf.
  #
  # Family-specific providers share the same "default" runtime config and
  # ProviderConfig unless given their own.
  #
  # acm/route53 back these charts' own ingress-cert Composition
  # (templates/composition-ingresscertificate.yaml) — provisions the
  # per-hostname ACM certs and their Route53 DNS validation records.
  # Add more packages (provider-aws-s3, ...) here as other AWS resources
  # move under Crossplane.
  provider:
    packages:
      - xpkg.upbound.io/upbound/provider-family-aws:v2.8.1
      - xpkg.upbound.io/upbound/provider-aws-acm:v2.8.1
      - xpkg.upbound.io/upbound/provider-aws-route53:v2.8.1

  # Composition Functions — the pipeline that renders
  # templates/composition-ingresscertificate.yaml's composed resources.
  # function-patch-and-transform does the actual field wiring, including
  # the cross-resource hop (Certificate's assigned validation record ->
  # XR status -> Route53 Record) that a plain, function-less Composition
  # can't express; function-auto-ready rolls up the composed resources'
  # own Ready conditions into the composite's, so `kubectl get
  # ingresscertificates` actually reflects reality instead of always
  # reading Ready.
  function:
    packages:
      - xpkg.upbound.io/crossplane-contrib/function-patch-and-transform:v0.10.9
      - xpkg.upbound.io/crossplane-contrib/function-auto-ready:v0.7.0

  # Pin to the system node group (terraform/envs/prod's
  # eks_managed_node_groups.default: labels role=system, taint
  # CriticalAddonsOnly=true:NoSchedule), same as this repo's other
  # cluster-critical charts. Covers the Crossplane and RBAC Manager pods;
  # the AWS provider pod is pinned separately via
  # templates/deploymentruntimeconfig.yaml.
  nodeSelector:
    role: system
  tolerations:
    - key: CriticalAddonsOnly
      operator: Equal
      value: "true"
      effect: NoSchedule

  rbacManager:
    replicas: 2
    nodeSelector:
      role: system
    tolerations:
      - key: CriticalAddonsOnly
        operator: Equal
        value: "true"
        effect: NoSchedule

# Values for this chart's own templates (DeploymentRuntimeConfig /
# ProviderConfig), not the crossplane subchart.
runtimeConfig:
  # Must stay "default" — it's the CRD's own default for
  # Provider.spec.runtimeConfigRef.name, which is how the family provider
  # installed above picks this up without us creating a Provider object
  # ourselves.
  name: default
  # Fixed name (instead of the package manager's hash-suffixed default) so
  # terraform/envs/prod/domain.tf's EKS Pod Identity association has a
  # stable target.
  serviceAccountName: provider-aws

providerConfig:
  # Was disabled until the AWS family provider package above finished
  # installing and registered its CRDs (a few minutes after first sync) —
  # applying a ProviderConfig before then fails with "no matches for kind
  # ProviderConfig in version aws.upbound.io/v1beta1", the same
  # bootstrap-ordering problem the cert-manager chart used to solve with
  # `clusterIssuer.enabled: false`. Confirmed live via `kubectl get
  # providers` (family/acm/route53 all HEALTHY=True) before flipping this
  # to true — needs the same re-check after any full cluster rebuild,
  # before the ingress-cert Composition's resources can do anything.
  enabled: true
  name: aws-pod-identity

# Feeds templates/ingresscertificates.yaml, which creates one
# IngressCertificate XR per hostname — each provisions its own ACM cert +
# Route53 DNS validation record via templates/composition-ingresscertificate.yaml.
ingressCertificates:
  region: us-east-1
  # terraform/envs/prod output `hosted_zone_id` (data.aws_route53_zone.this).
  zoneId: Z03083393MYD67KYV7VMW
  hostnames:
    argocd: argocd.hivemind.chaima.online
    greeter: greeter.hivemind.chaima.online
