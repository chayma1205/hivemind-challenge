# Values passed through to the kube-prometheus-stack subchart (dependency
# name: kube-prometheus-stack).
# Full reference: https://github.com/prometheus-community/helm-charts/blob/kube-prometheus-stack-91.5.0/charts/kube-prometheus-stack/values.yaml
kube-prometheus-stack:
  # EKS doesn't expose these control-plane components to customers the way
  # a self-managed cluster would (no node running kube-scheduler/
  # kube-controller-manager/etcd is ever visible to us, and kube-proxy's
  # metrics endpoint isn't reachable the way this chart expects either) —
  # left at the chart's own defaults, every target here would sit
  # permanently "down" and generate noise instead of signal. Disabled
  # up front rather than discovered as another live-only bug.
  kubeControllerManager:
    enabled: false
  kubeScheduler:
    enabled: false
  kubeEtcd:
    enabled: false
  kubeProxy:
    enabled: false

  prometheusOperator:
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 256Mi
    # Deliberately NOT pinned to the system node group (role: system),
    # unlike charts/env/prod/critical/'s charts (Karpenter, the ALB
    # controller, Crossplane). Those are pinned because they're
    # bootstrap-order-sensitive — Karpenter has to be running before it
    # can provision the capacity everything else needs. This is a central
    # service (observability for the whole cluster — same category as
    # ../argocd, not ../../critical/karpenter), with no such circularity,
    # so it's left for Karpenter to place and size like any other
    # workload. Confirmed live before writing this: the two system-group
    # nodes are already at 86%/67% CPU *requests* — pinning this stack
    # there on top of that would have been a self-inflicted
    # resource-pressure problem, not a safety improvement.
    admissionWebhooks:
      patch:
        resources:
          requests:
            cpu: 50m
            memory: 64Mi

  prometheus:
    prometheusSpec:
      replicas: 1
      retention: 15d
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          memory: 1Gi
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: gp3
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                # ~15d retention at this cluster's current scale (a
                # handful of workloads, 3 nodes) comfortably fits well
                # under this; sized with headroom rather than tuned tight,
                # since `allowVolumeExpansion: true` on the gp3
                # StorageClass (templates/storageclass-gp3.yaml) makes
                # growing it later a live, non-disruptive resize anyway.
                storage: 20Gi
      # Scrapes every ServiceMonitor/PodMonitor/PrometheusRule in the
      # cluster, not just ones with a matching release label — this is a
      # single-tenant cluster (one team, one Prometheus), so the usual
      # multi-tenant "only watch my own namespace's monitors" restriction
      # just means remembering to label every future ServiceMonitor
      # correctly for no real isolation benefit.
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      probeSelectorNilUsesHelmValues: false
      ruleSelectorNilUsesHelmValues: false

  alertmanager:
    # Pinned (the subchart's own default is "", auto-generated) so
    # terraform/envs/prod/observability.tf's EKS Pod Identity association
    # has a stable target — same reasoning as crossplane's
    # runtimeConfig.serviceAccountName.
    serviceAccount:
      name: alertmanager
    alertmanagerSpec:
      replicas: 1
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 128Mi
      storage:
        volumeClaimTemplate:
          spec:
            storageClassName: gp3
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                # Small on purpose — this only persists Alertmanager's own
                # notification/silence state (so a pod restart doesn't
                # re-fire every currently-active alert), not metrics data.
                storage: 2Gi
    # Delivers via SNS, not SES/SMTP — chosen specifically to avoid a
    # static credential. sigv4 with no access_key/secret_key falls back
    # to the AWS SDK's default credential chain, which for this pod means
    # its EKS Pod Identity association
    # (terraform/envs/prod/observability.tf, scoped to sns:Publish on
    # exactly this one topic) — no access key anywhere, unlike SES's SMTP
    # interface, whose password is derived from a long-lived IAM access
    # key. The SNS topic has an email subscription
    # (terraform/envs/prod/observability.tf's
    # aws_sns_topic_subscription.alertmanager_email) — SNS emails a
    # confirmation link on first apply; delivery is silently a no-op
    # until that's clicked.
    config:
      route:
        receiver: "sns"
        group_by: ["alertname", "namespace"]
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 12h
      receivers:
        - name: "sns"
          sns_configs:
            # terraform/envs/prod output `alertmanager_sns_topic_arn`.
            - topic_arn: "arn:aws:sns:us-east-1:324464328617:hivemind-prod-alertmanager"
              sigv4:
                region: us-east-1
              subject: '{{ template "sns.default.subject" . }}'
        # Kept, not dead weight: the subchart injects its own route
        # sending the always-firing "Watchdog" alert (proof the pipeline
        # itself is alive) to a receiver literally named "null" — that
        # route exists regardless of what's configured here, so removing
        # this receiver definition would leave it pointing at nothing and
        # fail Alertmanager's own config validation at startup. Confirmed
        # by rendering this chart and reading the actual generated route.
        - name: "null"

  grafana:
    replicas: 1
    # 256Mi was wrong — confirmed live: the grafana container OOMKilled
    # (exit 137) repeatedly under normal startup, settling at ~214Mi once
    # stable, essentially the whole limit with zero headroom for a
    # request spike or a heavier dashboard load. Request bumped to match
    # real steady-state usage instead of a guess; limit doubled for
    # actual headroom.
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi
    persistence:
      enabled: true
      storageClassName: gp3
      # Dashboards themselves are re-provisioned from this chart's
      # sidecar config on every restart either way; this just keeps
      # anything created/changed through the Grafana UI itself (ad hoc
      # dashboards, org settings) from being lost on a pod reschedule.
      size: 2Gi
    # Admin credentials: left unset here on purpose, which makes the
    # subchart generate a random password into a Secret
    # (<release>-grafana) rather than a value sitting in this repo's git
    # history. Retrieve it with:
    #   kubectl get secret -n <namespace> <release>-grafana \
    #     -o jsonpath='{.data.admin-password}' | base64 -d
    #
    # ALB-fronted, same pattern as the argocd/greeter ingresses
    # (../argocd/values.yaml, ../../apps/greeter/values.yaml): no
    # certificate-arn annotation — the ALB controller auto-discovers a
    # matching ACM cert by comparing spec.tls[].hosts against certificates
    # in ACM
    # (https://kubernetes-sigs.github.io/aws-load-balancer-controller/latest/guide/ingress/cert_discovery/).
    # The cert itself is Crossplane-managed
    # (../../critical/crossplane/templates/composition-ingresscertificate.yaml)
    # — "grafana" was added to that chart's values.yaml
    # ingressCertificates.hostnames alongside this.
    #
    # No `tls[].secretName` — the ALB controller doesn't do secret-based
    # TLS termination, it only reads `hosts` to run cert discovery; a
    # secretName here would be dead weight the chart's own template
    # doesn't require.
    ingress:
      enabled: true
      ingressClassName: alb
      hosts:
        - grafana.hivemind.chaima.online
      tls:
        - hosts:
            - grafana.hivemind.chaima.online
      annotations:
        alb.ingress.kubernetes.io/scheme: internet-facing
        alb.ingress.kubernetes.io/target-type: ip
        alb.ingress.kubernetes.io/backend-protocol: HTTP
        # /api/health, not / — the root path 302-redirects to /login,
        # which ALB target-group health checks treat as unhealthy by
        # default; Grafana's own health endpoint returns a plain 200.
        alb.ingress.kubernetes.io/healthcheck-path: /api/health
        alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
        alb.ingress.kubernetes.io/ssl-redirect: "443"
    sidecar:
      dashboards:
        enabled: true
        # Ships Kubernetes cluster/node/pod dashboards out of the box —
        # not hand-building dashboards for things Grafana Labs already
        # maintains well.
        defaultDashboardsEnabled: true
      # The two k8s-sidecar containers (dashboard/datasource watchers) had
      # no resource limits at all — found by reading actual
      # `kubectl top pod --containers` usage (~70-75Mi each, steady)
      # rather than guessing. Small, real numbers with headroom, not left
      # unbounded. (Shared across both sidecar containers — this is the
      # one `sidecar:` key the grafana subchart actually reads; a second,
      # separate `sidecar:` block elsewhere in this file would silently
      # clobber this one, not merge with it — YAML duplicate-key
      # semantics, confirmed live the hard way.)
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 150Mi

  prometheus-node-exporter:
    # A DaemonSet, same as the aws-secrets-store-csi-driver-provider addon
    # in terraform/envs/prod/main.tf — it has to run on every node,
    # including the two tainted system-group ones, or those two nodes
    # (already the most resource-constrained in the cluster) would be the
    # ones with zero node-level metrics. No nodeSelector; a broad
    # toleration covers scheduling onto the tainted nodes without
    # requiring them.
    tolerations:
      - key: CriticalAddonsOnly
        operator: Exists

  kube-state-metrics:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi
