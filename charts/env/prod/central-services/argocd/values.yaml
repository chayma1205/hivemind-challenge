# Values passed through to the argo-cd subchart (dependency name: argo-cd).
# Full reference: https://github.com/argoproj/argo-helm/blob/argo-cd-10.9.1/charts/argo-cd/values.yaml
argo-cd:
  global:
    domain: argocd.hivemind.chaima.online

    # Pin every component to the system node group (see
    # terraform/envs/prod's eks_managed_node_groups.default: labels
    # role=system, taint CriticalAddonsOnly=true:NoSchedule) so ArgoCD
    # doesn't compete with app workload capacity. Every component
    # (server/controller/repoServer/applicationSet/redis/dex/notifications)
    # falls back to these unless it sets its own override.
    priorityClassName: system-cluster-critical
    nodeSelector:
      role: system
    tolerations:
      - key: CriticalAddonsOnly
        operator: Equal
        value: "true"
        effect: NoSchedule

  configs:
    params:
      # TLS terminates at the ALB (see server.ingress below); the server
      # itself can stay plain HTTP behind it.
      server.insecure: true
    rbac:
      policy.default: role:readonly

  server:
    replicas: 2
    ingress:
      enabled: true
      ingressClassName: alb
      # Renders spec.tls[].hosts (plus a secretName the ALB controller
      # never reads — it doesn't do secret-based TLS termination). What
      # actually matters here is the hosts list: no certificate-arn
      # annotation below, deliberately, so the ALB controller
      # auto-discovers a matching ACM cert by comparing this against
      # certificates in ACM
      # (https://kubernetes-sigs.github.io/aws-load-balancer-controller/latest/guide/ingress/cert_discovery/)
      # — charts/env/prod/critical/crossplane provisions a real, dedicated
      # per-hostname cert for exactly this host, fully automatically (see
      # that chart's ingressCertificates.hostnames and
      # templates/composition-ingresscertificate.yaml).
      tls: true
      annotations:
        alb.ingress.kubernetes.io/scheme: internet-facing
        alb.ingress.kubernetes.io/target-type: ip
        alb.ingress.kubernetes.io/backend-protocol: HTTP
        alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
        alb.ingress.kubernetes.io/ssl-redirect: "443"
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 256Mi

  controller:
    replicas: 1
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        memory: 1Gi

  repoServer:
    replicas: 2
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 4
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 512Mi

  applicationSet:
    replicas: 2

  redis:
    resources:
      requests:
        cpu: 100m
        memory: 64Mi
      limits:
        memory: 256Mi

  notifications:
    enabled: true

    # Pushes into the same Alertmanager the kube-prometheus-stack chart
    # installs (charts/env/prod/central-services/kube-prometheus-stack),
    # not a separate Slack/email/webhook integration — reuses the SNS
    # email delivery already wired there
    # (terraform/envs/prod/observability.tf) instead of standing up a
    # second notification path with its own credentials. No auth
    # needed: this is a plain in-cluster HTTP call to Alertmanager's own
    # API, and Alertmanager doesn't require one by default.
    #
    # Fixes a real, twice-recurring near-miss (docs/ASSESSMENT.md bugs 6
    # and 7): a live `kubectl` fix silently reverted by `selfHeal`
    # because it wasn't pushed to git yet, caught both times only by
    # someone happening to check afterward. An Application briefly going
    # OutOfSync is exactly what that revert looks like from the outside.
    notifiers:
      service.alertmanager: |
        targets:
        - kube-prometheus-stack-alertmanager.monitoring.svc.cluster.local:9093

    # Not a built-in trigger — Argo CD's own catalog covers
    # on-sync-status-unknown (sync status = Unknown) but has no
    # equivalent for OutOfSync specifically (confirmed against the
    # catalog at
    # https://github.com/argoproj/argo-cd/blob/master/notifications_catalog/install.yaml).
    # on-health-degraded, used below, is built in.
    triggers:
      trigger.on-out-of-sync: |
        - description: Application sync status became OutOfSync
          send:
          - app-out-of-sync
          when: app.status.sync.status == 'OutOfSync'

    templates:
      template.app-out-of-sync: |
        message: "Application {{.app.metadata.name}} is OutOfSync."
        alertmanager:
          labels:
            alertname: ArgoCDAppOutOfSync
            severity: warning
            namespace: "{{.app.metadata.namespace}}"
            app: "{{.app.metadata.name}}"
          annotations:
            summary: "Argo CD Application {{.app.metadata.name}} drifted from git (OutOfSync)"
            description: >-
              {{.app.metadata.name}}'s live state no longer matches git.
              If selfHeal is on for this Application, this is either a
              normal in-flight deploy (should clear within a minute or
              two on its own) or a live kubectl edit about to get
              reverted — check which before assuming it's nothing.
      # Overrides the built-in template.app-health-degraded (same name,
      # so this chart value wins) — the stock one only defines
      # email/slack blocks, no `alertmanager:` block, so it wouldn't
      # actually reach the receiver configured above.
      template.app-health-degraded: |
        message: "Application {{.app.metadata.name}} is Degraded."
        alertmanager:
          labels:
            alertname: ArgoCDAppDegraded
            severity: warning
            namespace: "{{.app.metadata.namespace}}"
            app: "{{.app.metadata.name}}"
          annotations:
            summary: "Argo CD Application {{.app.metadata.name}} is Degraded"

    # Global — applies to every Application, not just ones annotated
    # individually. Deliberate: the whole point is catching this on
    # anything, not remembering to opt every chart in one at a time.
    subscriptions:
      - recipients:
          - alertmanager
        triggers:
          - on-out-of-sync
          - on-health-degraded
