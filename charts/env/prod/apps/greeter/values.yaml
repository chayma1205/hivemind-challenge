replicaCount: 2

image:
  # terraform/envs/prod output `ecr_repository_url` (module.ecr_greeter).
  # Fixed — only `tag` below moves.
  repository: "324464328617.dkr.ecr.us-east-1.amazonaws.com/hivemind-greeter"
  # Bootstrap value only. Owned by Argo CD Image Updater from here on: see
  # charts/env/prod/central-services/argocd-image-updater/templates/imageupdater.yaml,
  # which overwrites this field via a git commit whenever a new `vX.Y.Z`
  # tag lands in ECR (published as a GitHub Release in the hivemind-greeter
  # repo — see docs/DECISIONS.md #11). Don't hand-edit once that's live;
  # it'll just be overwritten on the next sync.
  tag: "ea792b8"
  pullPolicy: IfNotPresent

# Pod-level hardening. runAsUser is REQUIRED alongside runAsNonRoot, not
# optional: the Dockerfile's `USER nonroot:nonroot` is a *named* user, and
# the kubelet's runAsNonRoot check needs a numeric UID to verify against
# — it doesn't read /etc/passwd inside the image. Without runAsUser here,
# every pod fails at container-start with "container has runAsNonRoot and
# image has non-numeric user (nonroot), cannot verify user is non-root"
# (hit this live: server-side dry-run validation doesn't catch it, only
# an actual kubelet on a real node does). 65532:65532 confirmed against
# the built image's /etc/passwd, not assumed — it's the standard
# distroless "nonroot" UID/GID, but distroless doesn't guarantee it'll
# never change, hence checking rather than hardcoding from convention.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532

# Every rendered value here becomes a container env var. HELLO_TAG is
# echoed back in every response (see app/greeter.go) — set it to something
# unique per deployment/environment.
env:
  HELLO_TAG: ""

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  ingressClassName: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/backend-protocol: HTTP
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    # No certificate-arn annotation, deliberately: the ALB controller
    # auto-discovers a matching ACM cert by comparing this Ingress's
    # spec.tls[].hosts (and rules[].host) against certificates in ACM
    # (https://kubernetes-sigs.github.io/aws-load-balancer-controller/latest/guide/ingress/cert_discovery/)
    # — terraform/envs/prod/domain.tf provisions a real, dedicated
    # per-hostname cert for exactly this host, fully automatically (one
    # `terraform apply`, no manual ARN copy-paste). Set this annotation
    # explicitly only if that discovery ever needs overriding.
  host: greeter.hivemind.chaima.online

resources:
  requests:
    cpu: 50m
    memory: 32Mi
  limits:
    memory: 64Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

# Right-sizing recommendations (not enforcement) for this Deployment's
# resource requests/limits. Requires
# charts/env/prod/critical/vertical-pod-autoscaler to be installed —
# see that chart's README for why it isn't.
verticalPodAutoscaler:
  enabled: true
  # "Off": recommendation-only, never evicts or mutates a pod. Stays Off
  # deliberately — autoscaling.enabled above is a CPU-based HPA, and an
  # *active* VPA (Auto/Initial/Recreate) on the same metric for the same
  # workload is a well-known anti-pattern (the two controllers can fight
  # each other). Read recommendations with:
  #   kubectl describe vpa greeter -n greeter
  # and adjust `resources` above by hand once they've had time to settle
  # — switching this to "Auto" is a deliberate later decision, not a
  # default to flip casually.
  updateMode: "Off"

podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Spread pods across AZs instead of piling onto one; ScheduleAnyway so a
# temporary imbalance doesn't block scheduling outright.
topologySpreadConstraints:
  enabled: true
  maxSkew: 1
  whenUnsatisfiable: ScheduleAnyway

# Keep replicas off the same node (distinct from topologySpreadConstraints
# above, which is AZ-level and doesn't prevent two replicas sharing a
# node). "soft" (preferred, default) avoids co-location without blocking
# scheduling if capacity is tight; "hard" (required) guarantees it but can
# leave replicas Pending if fewer schedulable nodes than replicas exist —
# a real risk today since general workload capacity depends on Karpenter
# being fully wired up (see README).
podAntiAffinity:
  enabled: true
  type: soft

# This is app workload, not a cluster-critical add-on, so it deliberately
# does NOT set nodeSelector/tolerations for the `role=system` /
# CriticalAddonsOnly-tainted node group (contrast with
# charts/env/prod/critical/*) — see this chart's README for what that
# implies about current cluster capacity.
nodeSelector: {}
tolerations: []
