name: CI

# This repo is GitOps-only now: the greeter app's source, Dockerfile, and
# build/test/scan/push pipeline moved to a separate repo
# (https://github.com/chayma1205/hivemind-greeter — see docs/DECISIONS.md
# #11). All that's left to validate here is the Helm chart this repo
# renders into charts/env/prod/argocd-apps.yaml.
on:
  pull_request:
    branches: [main]
    paths:
      - "charts/**"
      - "scripts/generate-argocd-apps.sh"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "charts/**"
      - "scripts/generate-argocd-apps.sh"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  helm-lint:
    name: Lint the greeter Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: "v3.17.3"

      - name: helm lint
        working-directory: charts/env/prod/apps/greeter
        run: helm lint . --set image.repository=placeholder --set image.tag=placeholder

  argocd-apps-up-to-date:
    name: argocd-apps.yaml matches the chart directories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate and diff
        run: |
          ./scripts/generate-argocd-apps.sh
          if ! git diff --quiet -- charts/env/prod/argocd-apps.yaml; then
            echo "::error::charts/env/prod/argocd-apps.yaml is stale — run scripts/generate-argocd-apps.sh and commit the result."
            git diff -- charts/env/prod/argocd-apps.yaml
            exit 1
          fi
